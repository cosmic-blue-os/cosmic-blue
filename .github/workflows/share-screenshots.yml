---
# Copies the VM screenshots of an image build to the "screenshots" branch
# (one commit, replaced each time), so they can be looked at and shared
# without downloading the build's artifacts. Run by hand; it takes no
# screenshot itself (tests/vm-lib.sh does, in build.yml).
name: Share screenshots

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run id (empty: the latest successful build of main)"
        type: string
        required: false

permissions:
  contents: write  # push the screenshots branch
  actions: read    # download the build's artifacts

concurrency:
  group: ${{ github.workflow }}

jobs:
  share:
    name: Share screenshots
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Download the screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [[ -z "${RUN_ID}" ]]; then
            RUN_ID="$(gh run list -R "${REPO}" --workflow build.yml --branch main \
                --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          mkdir -p shots
          for image in celenn celenn-nvidia; do
            if gh run download "${RUN_ID}" -R "${REPO}" -n "boot-test-${image}" -D "dl/${image}"; then
              mkdir -p "shots/${image}"
              cp dl/"${image}"/screenshots/* "shots/${image}/" 2>/dev/null || true
            fi
          done
          [[ -n "$(ls -A shots)" ]] || { echo "::error::No screenshots in run ${RUN_ID}"; exit 1; }
          printf 'Screenshots of build run %s/%s/actions/runs/%s\n' \
              "${GITHUB_SERVER_URL}" "${REPO}" "${RUN_ID}" > shots/README.md
          echo "RUN_ID=${RUN_ID}" >> "${GITHUB_ENV}"

      - name: Push the screenshots branch
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        working-directory: shots
        run: |
          set -euo pipefail
          git init -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots of build run ${RUN_ID}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" screenshots
          echo "Screenshots of run ${RUN_ID} on the screenshots branch" >> "${GITHUB_STEP_SUMMARY}"
