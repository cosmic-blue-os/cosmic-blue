---
# Publishes the release notes of a stable image as a GitHub Release: the
# Celenn OS commits between the two builds (sorted by what they change),
# the main packages and every package change since the previous stable
# image, and how to get it. No file is attached (the live
# ISO is too big for a release). It then updates the "Versions" block of
# README.md (Fedora, kernel, COSMIC, Mesa, NVIDIA driver of `stable`) with a
# commit on the default branch.
#
# Called by promote-stable.yml each time `stable` moves. On a pull request
# that changes it, it only previews the notes of `testing` against `stable`
# and the README block in the run summary, without publishing anything.
# Run by hand, it only refreshes the README block from the current `stable`
# (e.g. after rolling stable back), without a release. Run by hand with
# `rewrite` set to an existing release tag, it only writes the notes of that
# release again (current layout, compared with the stable release before it).
name: Release notes

on:
  workflow_call:
    inputs:
      old:
        description: "Previous stable image: digest (sha256:...) or tag. Empty: no previous image."
        type: string
        default: ""
      new:
        description: "New stable image: digest (sha256:...) or tag"
        type: string
        required: true
      release_tag:
        description: "Git tag and name of the release (e.g. stable-20261117)"
        type: string
        required: true
  workflow_dispatch:
    inputs:
      rewrite:
        description: "Existing release to write again (e.g. stable-20261117). Empty: only refresh the README."
        type: string
        default: ""
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/release-notes.yml'
      - '.github/scripts/release-notes.py'
      - '.github/scripts/readme-versions.py'

env:
  IMAGE_NAME: ${{ github.event.repository.name }} # output of build.yml, keep in sync
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

jobs:
  notes:
    name: Write release notes
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Kept only to push the README update (not on pull requests)
          persist-credentials: ${{ github.event_name != 'pull_request' }}

      - name: Maximize space for the images
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: List packages and commits
        id: lists
        env:
          # A pull request previews `testing` against the current `stable`
          OLD: ${{ github.event_name == 'pull_request' && 'stable' || inputs.old }}
          NEW: ${{ github.event_name == 'pull_request' && 'testing' || inputs.new || 'stable' }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.rewrite }}
          REWRITE: ${{ inputs.rewrite }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}"
          out="${RUNNER_TEMP}/notes"
          mkdir -p "${out}"

          ref_of() {
            if [[ "$1" == sha256:* ]]; then
              echo "${image}@$1"
            else
              echo "${image}:$1"
            fi
          }

          # Git commit an image was built from, empty if unknown: its
          # revision label, or for the images built before 2026-11-14 the end
          # of its version label (e.g. latest.20261110-abc1234)
          commit_of() {
            skopeo inspect "docker://$1" \
              | jq -r '.Labels["org.opencontainers.image.revision"]
                       // (.Labels["org.opencontainers.image.version"] // ""
                           | capture("-(?<sha>[0-9a-f]{7,40})$").sha)
                       // ""'
          }

          # Version of an image (e.g. 44.20261110.1), empty for the images
          # built before versions looked like this
          version_of() {
            skopeo inspect "docker://$1" \
              | jq -r '.Labels["org.opencontainers.image.version"] // ""' \
              | grep -xE '[0-9]+\.[0-9]{8}(\.[0-9]+)?' || true
          }

          # NVIDIA driver (EVR) of the NVIDIA image with the same tag, empty
          # if not found: from its signed SBOM (a few MB, see build.yml),
          # else from the image itself for the images built without one
          nvidia_of() {
            local nv evr
            nv="${image}-nvidia:$1"
            evr="$(cosign verify-attestation --key cosign.pub --type spdxjson \
                     --insecure-ignore-tlog=true "${nv}" 2>/dev/null \
                   | head -n 1 \
                   | jq -r '.payload | @base64d | fromjson | .predicate.packages[]
                            | select(.name == "nvidia-driver") | .versionInfo' \
                   | head -n 1)" || evr=""
            if [[ -z "${evr}" ]] && podman pull -q "${nv}" >/dev/null 2>&1; then
              evr="$(podman run --rm --pull=never --entrypoint rpm "${nv}" \
                       -q --qf '%{EPOCH}:%{VERSION}-%{RELEASE}' nvidia-driver 2>/dev/null)" || evr=""
              podman rmi -f "${nv}" >/dev/null
            fi
            echo "${evr}"
          }

          # One image at a time to keep the disk usage down
          packages_of() {
            podman pull -q "$1" >/dev/null
            podman run --rm --pull=never --entrypoint rpm "$1" \
              -qa --qf '%{NAME}\t%{EVR}\t%{SOURCERPM}\n' | sort > "$2"
            podman rmi -f "$1" >/dev/null
            echo "$(wc -l < "$2") packages in $1"
          }

          # Previous stable release: the last one before this one (not this
          # one if promoted again the same day; all of them for a preview)
          previous="$(gh api "repos/${REPO}/releases?per_page=100" \
                        --jq "[.[] | select(.draft | not) | .tag_name
                               | select(startswith(\"stable-\") and . < \"${RELEASE_TAG:-stable-99999999}\")]
                              | sort | last // \"\"")"
          echo "Previous release: ${previous:-none}"
          if [[ -n "${REWRITE}" ]]; then
            # The dated stable tags of both images are kept (clean-images.yml)
            NEW="${REWRITE}"
            OLD="${previous}"
          fi

          new_ref="$(ref_of "${NEW}")"
          packages_of "${new_ref}" "${out}/new.tsv"
          new_commit="$(commit_of "${new_ref}")"
          new_sha=""
          if [[ -n "${new_commit}" ]]; then
            new_sha="$(gh api "repos/${REPO}/commits/${new_commit}" --jq .sha)"
          fi
          echo "new_sha=${new_sha}" >> "${GITHUB_OUTPUT}"
          echo "new_version=$(version_of "${new_ref}")" >> "${GITHUB_OUTPUT}"

          args=(--new "${out}/new.tsv")
          # The NVIDIA image moves to stable in the same run (by tag, not
          # by digest: it has its own digests)
          nvidia_tag="${{ github.event_name == 'pull_request' && 'testing' || inputs.rewrite || 'stable' }}"
          nvidia="$(nvidia_of "${nvidia_tag}")"
          echo "NVIDIA driver in ${image}-nvidia:${nvidia_tag}: ${nvidia:-not found}"
          [[ -n "${nvidia}" ]] && args+=(--nvidia "${nvidia}")
          args+=(--site "https://${REPO%%/*}.github.io/${REPO#*/}/")
          # NVIDIA driver of the previous release, from the NVIDIA image's tag
          if [[ -n "${previous}" ]]; then
            args+=(--previous-release "${previous}")
            nvidia_old="$(nvidia_of "${previous}")"
            if [[ -n "${nvidia_old}" ]]; then args+=(--nvidia-old "${nvidia_old}"); fi
          fi
          if [[ -n "${OLD}" ]]; then
            old_ref="$(ref_of "${OLD}")"
            packages_of "${old_ref}" "${out}/old.tsv"
            args+=(--old "${out}/old.tsv")
            old_commit="$(commit_of "${old_ref}")"
            if [[ -n "${old_commit}" && -n "${new_commit}" ]]; then
              : > "${out}/commits.tsv"
              if [[ "${old_commit}" != "${new_commit}" ]]; then
                # SHA, author, subject and changed files of each commit,
                # to sort them in the notes (image, website, build)
                gh api "repos/${REPO}/compare/${old_commit}...${new_commit}" \
                  --jq '.commits | reverse | .[] | [.sha, (.author.login // ""), (.commit.message | split("\n")[0])] | @tsv' \
                  | while IFS=$'\t' read -r sha author subject; do
                      files="$(gh api "repos/${REPO}/commits/${sha}" --jq '[.files[].filename] | join(" ")')"
                      printf '%s\t%s\t%s\t%s\n' "${sha}" "${author}" "${subject}" "${files}"
                    done > "${out}/commits.tsv"
              fi
              args+=(--commits "${out}/commits.tsv"
                     --compare-url "https://github.com/${REPO}/compare/${old_commit}...${new_commit}")
            fi
          fi
          printf '%q ' "${args[@]}" > "${out}/args"

      - name: Write the notes
        env:
          RELEASE_TAG: ${{ github.event_name == 'pull_request' && 'preview' || inputs.release_tag || inputs.rewrite || 'stable' }}
          VERSION: ${{ steps.lists.outputs.new_version }}
        run: |
          set -euo pipefail
          image="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}"
          out="${RUNNER_TEMP}/notes"
          if [[ "${GITHUB_EVENT_NAME}" == pull_request ]]; then
            title="Preview: testing${VERSION:+ (${VERSION})} compared with stable"
            ref="${image}:testing"
          else
            # stable-20261117 -> Celenn OS 44.20261110 (stable 2026-11-17)
            date="${RELEASE_TAG#stable-}"
            date="${date:0:4}-${date:4:2}-${date:6:2}"
            if [[ -n "${VERSION}" ]]; then
              title="Celenn OS ${VERSION} (stable ${date})"
            else
              title="Celenn OS stable ${date}"
            fi
            ref="${image}:${RELEASE_TAG}"
          fi
          eval "args=($(< "${out}/args"))"
          python3 -I .github/scripts/release-notes.py "${args[@]}" \
            --title "${title}" --image "${ref}" \
            --versions-block "${out}/versions.md" --version "${VERSION}" \
            > "${out}/notes.md"
          cat "${out}/notes.md" >> "${GITHUB_STEP_SUMMARY}"
          # Check the README block can be replaced, and preview it
          python3 -I .github/scripts/readme-versions.py "${out}/versions.md" README.md "${VERSION}"
          echo "${VERSION}" > "${out}/version"
          {
            echo
            echo "### README versions block"
            echo
            cat "${out}/versions.md"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish the release
        # Not when run by hand to refresh the README (no release tag)
        if: github.event_name != 'pull_request' && (inputs.release_tag != '' || inputs.rewrite != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || inputs.rewrite }}
          REWRITE: ${{ inputs.rewrite }}
          TARGET: ${{ steps.lists.outputs.new_sha || github.sha }}
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/notes/notes.md"
          title="$(head -n 1 "${notes}" | sed 's/^# //')"
          tail -n +3 "${notes}" > "${RUNNER_TEMP}/body.md"
          if [[ -n "${REWRITE}" ]]; then
            # Older release written again: its tag and "Latest" status stay
            gh release edit "${RELEASE_TAG}" --title "${title}" --notes-file "${RUNNER_TEMP}/body.md"
          elif gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            # Promoted again the same day: replace the notes
            gh release edit "${RELEASE_TAG}" --title "${title}" --notes-file "${RUNNER_TEMP}/body.md" --latest
          else
            gh release create "${RELEASE_TAG}" --target "${TARGET}" \
              --title "${title}" --notes-file "${RUNNER_TEMP}/body.md" --latest
          fi
          echo "Release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"

      # A commit with the default token starts no workflow (and build.yml
      # ignores README.md anyway). Retried if the branch moved meanwhile.
      - name: Update the README
        if: github.event_name != 'pull_request' && inputs.rewrite == ''
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          block="${RUNNER_TEMP}/notes/versions.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q --depth 1 origin "${BRANCH}"
            git checkout -q -f --detach FETCH_HEAD
            python3 -I .github/scripts/readme-versions.py "${block}" README.md "$(cat "${RUNNER_TEMP}/notes/version")"
            if git diff --quiet README.md; then
              echo "README versions already up to date"
              exit 0
            fi
            git commit -q -m "Update README versions for ${RELEASE_TAG:-stable}" README.md
            if git push -q origin "HEAD:refs/heads/${BRANCH}"; then
              echo "README updated: $(git rev-parse HEAD)" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep $((attempt * 10))
          done
          echo "::error::Could not push the README update"
          exit 1
