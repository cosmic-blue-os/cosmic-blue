---
# Live ISO: boots into a COSMIC live session, from which the Anaconda installer
# installs the image embedded in the ISO (no download needed).
# Built with ublue-os/titanoboa, the same way projectbluefin/iso builds Bluefin's.
# Each ISO is then installed in a virtual machine (tests/vm-iso-install-test.sh)
# and only published for download if the installed system starts cleanly.
name: Build live ISO

on:
  # Started by promote-stable.yml each time `stable` moves (Tuesdays), so the
  # ISO always installs the current stable image; can also be run by hand.
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/build-live-iso.yml'
      - 'iso_files/**'
      - 'tests/vm-iso-install-test.sh'

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  # Installed systems follow this tag. PR test builds use latest.
  DEFAULT_TAG: ${{ github.event_name == 'pull_request' && 'latest' || 'stable' }}
  # Same titanoboa revision as projectbluefin/iso
  TITANOBOA_REF: "840217d97bd0bc9a52466508c54d8dda5c5ba2fd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build live ISO${{ matrix.image_suffix && format(' ({0})', matrix.image_suffix) || '' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
      issues: write  # size alerts
    strategy:
      fail-fast: false
      matrix:
        # One ISO per image: cosmic-blue, and cosmic-blue-nvidia for NVIDIA cards
        image_suffix: ["", "nvidia"]
    env:
      # output of build.yml, keep in sync
      IMAGE_NAME: ${{ github.event.repository.name }}${{ matrix.image_suffix && format('-{0}', matrix.image_suffix) || '' }}

    steps:
      # A new image has no ISO until build.yml has published it once
      - name: Check the image is published
        id: image
        run: |
          image_ref="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}"
          if skopeo inspect --raw "docker://${image_ref}" >/dev/null; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::warning::${image_ref} is not published yet, no ISO for it"
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Maximize build space
        if: steps.image.outputs.published == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          extra-squeeze: "true"

      - name: Checkout
        if: steps.image.outputs.published == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Just
        if: steps.image.outputs.published == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Build ISO
        if: steps.image.outputs.published == 'true'
        id: build
        env:
          HOOK_POST_ROOTFS: ${{ github.workspace }}/iso_files/configure_live_iso.sh
        run: |
          set -euo pipefail
          image_ref="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}"
          titanoboa_dir="${RUNNER_TEMP}/titanoboa"
          git clone --quiet https://github.com/ublue-os/titanoboa "${titanoboa_dir}"
          git -C "${titanoboa_dir}" checkout --quiet "${TITANOBOA_REF}"
          # just >= 1.57 requires the list language feature used by which()
          sed -i '1a set lists' "${titanoboa_dir}/Justfile"
          # Compress the live root filesystem with xz and 1 MiB blocks instead
          # of mksquashfs' default (gzip, 128 KiB blocks), as Fedora's live
          # ISOs long did: about 20% smaller for a few more minutes of build.
          # zstd -19 saves less; xz's x86 filter doubles the time for ~2% more.
          squash_cmd='mksquashfs $0 $1/squashfs.img -all-root -noappend'
          sed -i "s|${squash_cmd}|${squash_cmd} -comp xz -b 1M|" "${titanoboa_dir}/Justfile"
          grep -qF -- "${squash_cmd} -comp xz -b 1M" "${titanoboa_dir}/Justfile"
          # The post-rootfs hook only sees the titanoboa checkout (mounted at
          # /app), so ship the welcome tour files inside it.
          cp -r iso_files/welcome "${titanoboa_dir}/cosmic-blue-welcome"
          echo "${DEFAULT_TAG}" > "${titanoboa_dir}/cosmic-blue-image-tag"

          # Arguments: image, livesys, flatpaks file, compression, extra kargs,
          # image embedded for the installer, polkit rules.
          # No flatpaks in the ISO: the installed system gets them on first boot.
          sudo \
            env PATH="${PATH}" \
            CI="${CI}" \
            HOOK_post_rootfs="${HOOK_POST_ROOTFS}" \
            TITANOBOA_BUILDER_DISTRO=fedora \
            "$(command -v just)" -f "${titanoboa_dir}/Justfile" build \
            "${image_ref}" 1 NONE squashfs NONE "${image_ref}" 1
          sudo chown "$(id -u):$(id -g)" "${titanoboa_dir}/output.iso"

          # e.g. artifact cosmic-blue-live-amd64-iso holding cosmic-blue-live-amd64.iso
          name="${IMAGE_NAME,,}-live-amd64"
          mkdir -p output
          mv "${titanoboa_dir}/output.iso" "output/${name}.iso"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"

      # Also uploaded on pull requests, so that the ISO can be tested before merging
      - name: Upload ISO to Job Artifacts
        if: steps.image.outputs.published == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.build.outputs.name }}-iso
          path: output/
          if-no-files-found: error
          retention-days: 0
          compression-level: 0
          overwrite: true

      # Size alert: the R2 free tier is 10 GB for both ISOs, so each one should
      # stay under 5 GB. Over that, warn on the run and, outside pull requests,
      # open (or comment on) an issue so the maintainer is notified.
      - name: Check ISO size
        if: steps.image.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISO_NAME: ${{ steps.build.outputs.name }}
          ISO_ALERT_BYTES: "5000000000"
        run: |
          set -euo pipefail
          size=$(stat -c %s "output/${ISO_NAME}.iso")
          size_gb=$(awk -v s="${size}" 'BEGIN { printf "%.2f", s / 1e9 }')
          echo "${ISO_NAME}.iso: ${size_gb} GB"
          echo "${ISO_NAME}.iso: **${size_gb} GB**" >> "${GITHUB_STEP_SUMMARY}"
          if (( size <= ISO_ALERT_BYTES )); then
            exit 0
          fi
          message="${ISO_NAME}.iso is ${size_gb} GB, over the 5 GB limit set to keep both ISOs within the 10 GB Cloudflare R2 free tier."
          echo "::warning::${message}"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            exit 0
          fi
          title="Live ISO over 5 GB: ${ISO_NAME}"
          body="${message}

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          The upload to R2 stops by itself if both ISOs together would exceed 10 GB."
          body="$(sed 's/^ *//' <<< "${body}")"
          number=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
          if [[ -n "${number}" ]]; then
            gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
          fi

  # Installs the ISO in a virtual machine, as a person would from a USB stick,
  # boots the installed system and checks it (tests/vm-iso-install-test.sh).
  # The public download is only replaced by an ISO that passed.
  install_test:
    name: Install test${{ matrix.image_suffix && format(' ({0})', matrix.image_suffix) || '' }}
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: read
      issues: write  # R2 size alerts
    strategy:
      fail-fast: false
      matrix:
        image_suffix: ["", "nvidia"]
    env:
      # output of build.yml, keep in sync
      IMAGE_NAME: ${{ github.event.repository.name }}${{ matrix.image_suffix && format('-{0}', matrix.image_suffix) || '' }}
      ISO_NAME: ${{ github.event.repository.name }}${{ matrix.image_suffix && format('-{0}', matrix.image_suffix) || '' }}-live-amd64

    steps:
      # Same check as the build job: no ISO without a published image
      - name: Check the image is published
        id: image
        run: |
          image_ref="${IMAGE_REGISTRY,,}/${IMAGE_NAME,,}:${DEFAULT_TAG}"
          echo "ref=${image_ref}" >> "${GITHUB_OUTPUT}"
          if skopeo inspect --raw "docker://${image_ref}" >/dev/null; then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Maximize build space
        if: steps.image.outputs.published == 'true'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Checkout
        if: steps.image.outputs.published == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare the install test
        if: steps.image.outputs.published == 'true'
        uses: ./.github/actions/vm-test-setup

      - name: Install xorriso
        if: steps.image.outputs.published == 'true'
        run: sudo apt-get install -y --no-install-recommends xorriso

      - name: Download the ISO
        if: steps.image.outputs.published == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ env.ISO_NAME }}-iso
          path: output

      - name: Install test
        id: install-test
        if: steps.image.outputs.published == 'true'
        timeout-minutes: 120
        env:
          IMAGE_REF: ${{ steps.image.outputs.ref }}
          # The virtual machine has no NVIDIA GPU for these to work with
          EXTRA_IGNORED_UNITS: ${{ matrix.image_suffix == 'nvidia' && 'nvidia-persistenced|nvidia-cdi-refresh' || '' }}
        run: |
          tests/vm-iso-install-test.sh "output/${ISO_NAME}.iso" "${IMAGE_REF}" "${RUNNER_TEMP}/iso-install-test"

      - name: Publish the install test results
        if: always() && steps.install-test.outcome != 'skipped'
        uses: ./.github/actions/vm-test-results
        with:
          dir: ${{ runner.temp }}/iso-install-test
          name: iso-install-test-${{ env.IMAGE_NAME }}
          title: ${{ env.IMAGE_NAME }} live ISO install

      # Public download for the website: the ISO and its checksum, under fixed
      # names so each build replaces the previous one (R2 free tier: 10 GB).
      # Only after a passed install test; skipped on pull requests and until
      # the R2 secrets are set.
      - name: Upload ISO to Cloudflare R2
        if: github.event_name != 'pull_request' && steps.install-test.outcome == 'success'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          ISO_NAME: ${{ env.ISO_NAME }}
          GH_TOKEN: ${{ github.token }}
          R2_LIMIT_BYTES: "10000000000"
        run: |
          set -euo pipefail
          if [[ -z "${AWS_ACCESS_KEY_ID}" || -z "${AWS_SECRET_ACCESS_KEY}" || -z "${R2_ACCOUNT_ID}" || -z "${R2_BUCKET}" ]]; then
            echo "::notice::R2 secrets or R2_BUCKET variable not set, skipping the public upload"
            exit 0
          fi
          cd output
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          # Stay within the free tier: everything else in the bucket plus this
          # ISO (which replaces its previous version) must fit in 10 GB.
          # Otherwise keep the current download, open an issue and fail the
          # job so the maintainer is notified and can review.
          size=$(stat -c %s "${ISO_NAME}.iso")
          others=$(aws s3api list-objects-v2 --endpoint-url "${endpoint}" \
            --bucket "${R2_BUCKET}" --output json \
            | jq --arg own "${ISO_NAME}.iso" \
              '[.Contents[]? | select(.Key != $own and .Key != ($own + ".sha256")) | .Size] | add // 0')
          total=$(( size + others ))
          total_gb=$(awk -v s="${total}" 'BEGIN { printf "%.2f", s / 1e9 }')
          echo "R2 bucket after upload: ${total_gb} GB"
          if (( total > R2_LIMIT_BYTES )); then
            message="Not uploaded to R2: with ${ISO_NAME}.iso the bucket would hold ${total_gb} GB, over the 10 GB free tier. The previous ISO stays online."
            echo "::error::${message}"
            title="Live ISO not published: R2 bucket over 10 GB"
            body="${message}

            Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            body="$(sed 's/^ *//' <<< "${body}")"
            number=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "\"${title}\" in:title" --json number --jq '.[0].number // empty')
            if [[ -n "${number}" ]]; then
              gh issue comment "${number}" --repo "${GITHUB_REPOSITORY}" --body "${body}"
            else
              gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body "${body}"
            fi
            exit 1
          fi

          sha256sum "${ISO_NAME}.iso" > "${ISO_NAME}.iso.sha256"
          # ISO first, then its checksum
          aws s3 cp --endpoint-url "${endpoint}" --no-progress \
            "${ISO_NAME}.iso" "s3://${R2_BUCKET}/${ISO_NAME}.iso"
          aws s3 cp --endpoint-url "${endpoint}" --no-progress \
            "${ISO_NAME}.iso.sha256" "s3://${R2_BUCKET}/${ISO_NAME}.iso.sha256"
