[package]
name = "celenn-tour"
version = "0.1.0"
edition = "2024"
publish = false

# Same libcosmic and features as COSMIC's first-run assistant
# (cosmic-initial-setup), so the tours look exactly like it. Cargo.lock is
# cosmic-initial-setup's epoch-<COSMIC version> Cargo.lock, trimmed by cargo to
# our dependencies (Containerfile.helpers builds with --locked);
# check-cosmic-version.yml refreshes it with each COSMIC version.
# celenn-tour (src/main.rs) is the package's own program; Tools (with
# its Updates page) is a second one, and Parental controls a third, sharing
# the translation code (src/i18n.rs) and the look
[[bin]]
name = "celenn-tour"
path = "src/main.rs"

[[bin]]
name = "celenn-tools"
path = "src/tools.rs"

# Parental controls: the app (window, warnings in a child's session) and the
# service that applies the rules as root (src/parental_daemon.rs, without
# libcosmic), sharing src/parental_rules.rs
[[bin]]
name = "celenn-parental-controls"
path = "src/parental.rs"

[[bin]]
name = "celenn-parental-daemon"
path = "src/parental_daemon.rs"

# The login screen's check (PAM module pam_celenn_parental.so)
[lib]
name = "pam_celenn_parental"
path = "src/pam_parental.rs"
crate-type = ["cdylib"]

[dependencies]
# Account pictures cut as smooth disks (style.rs), and the icons of web
# apps (webapps.rs: sites' PNG and ICO icons); already in the tree through
# libcosmic
image = { version = "0.25", default-features = false, features = ["ico", "jpeg", "png"] }
# COSMIC's own settings files (RON), read and written with the types the
# COSMIC programs use (webapp_folder.rs, webapp_launcher.rs); both already
# in the tree through libcosmic
ron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "process", "rt"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
default-features = false
features = ["a11y", "dbus-config", "tokio", "winit", "wgpu", "wayland", "xdg-portal"]

[profile.release]
lto = "thin"
